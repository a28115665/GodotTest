# Builds Godot project as HTML5 and deploys to GitHub Pages
name: Deploy Godot Game to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/godot-pokemon-game-sDS4D
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: |
          godot --version
          godot --headless --quit 2>/dev/null || true

      - name: Import project
        run: |
          godot --headless --import 2>/dev/null || true
          timeout 30 godot --headless --editor --quit 2>/dev/null || true

      - name: Build Web Export
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Add coi-serviceworker for SharedArrayBuffer support
        run: |
          cd build/web
          cat > coi-serviceworker.js << 'SWEOF'
          /*! coi-serviceworker v0.1.7 - Guido Zuidhof and contributors, licensed under MIT */
          let coepCredentialless=!1;"undefined"==typeof window?(self.addEventListener("install",(function(){self.skipWaiting()})),self.addEventListener("activate",(function(e){e.waitUntil(self.clients.claim())})),self.addEventListener("fetch",(function(e){("only-if-cached"!==e.request.cache||"same-origin"===e.request.mode)&&e.respondWith(fetch(e.request).then((function(e){if(0===e.status)return e;const r=new Headers(e.headers);return r.set("Cross-Origin-Embedder-Policy",coepCredentialless?"credentialless":"require-corp"),r.set("Cross-Origin-Opener-Policy","same-origin"),new Response(e.body,{status:e.status,statusText:e.statusText,headers:r})})).catch((function(e){return new Response(null,{status:404,statusText:"Not Found"})})))}))):"undefined"!=typeof navigator&&navigator.serviceWorker&&navigator.serviceWorker.register(window.document.currentScript.src).then((function(e){console.log("COOP/COEP Service Worker registered",e.scope)}),(function(e){console.error("COOP/COEP Service Worker failed to register",e)}));
          SWEOF

      - name: Patch index.html for cross-origin isolation
        run: |
          cd build/web
          sed -i 's|<head>|<head>\n\t<script src="coi-serviceworker.js"></script>|' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
