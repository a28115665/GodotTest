# Builds Godot project as HTML5 and deploys to GitHub Pages
name: Deploy Godot Game to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/godot-pokemon-game-sDS4D
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: |
          godot --version
          godot --headless --quit 2>/dev/null || true

      - name: Import project
        run: |
          godot --headless --import 2>/dev/null || true
          timeout 30 godot --headless --editor --quit 2>/dev/null || true

      - name: Build Web Export
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Add coi-serviceworker for SharedArrayBuffer support
        run: |
          cd build/web
          curl -fsSL https://raw.githubusercontent.com/nicholasgasior/gzuidhof-coi-serviceworker/refs/heads/master/coi-serviceworker.min.js -o coi-serviceworker.js || cat > coi-serviceworker.js << 'COIEOF'
          if(typeof window==='undefined'){let e=!1;self.addEventListener("install",function(){self.skipWaiting()}),self.addEventListener("activate",function(e){e.waitUntil(self.clients.claim())}),self.addEventListener("fetch",function(t){if("only-if-cached"===t.request.cache&&"same-origin"!==t.request.mode)return;t.respondWith(fetch(t.request).then(function(t){if(0===t.status)return t;let r=new Headers(t.headers);return r.set("Cross-Origin-Embedder-Policy",e?"credentialless":"require-corp"),r.set("Cross-Origin-Opener-Policy","same-origin"),new Response(t.body,{status:t.status,statusText:t.statusText,headers:r})}).catch(function(){return new Response(null,{status:404})}))})}else{(async function(){if(window.crossOriginIsolated!==false)return;let r=window.navigator.serviceWorker;if(!r)return;let reg=await r.register(window.document.currentScript.src);if(reg.active&&!r.controller){window.location.reload()}})()}
          COIEOF

      - name: Patch index.html for cross-origin isolation
        run: |
          cd build/web
          sed -i 's|<head>|<head>\n\t<script src="coi-serviceworker.js"></script>|' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
